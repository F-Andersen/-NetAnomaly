[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netanomaly"
version = "1.0.0"
description = "Network-flow anomaly detection prototype on CICIDS2017"
requires-python = ">=3.12"

[project.scripts]
netanomaly = "netanomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL via TEST_DATABASE_URL"]
