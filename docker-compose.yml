name: netanomaly

x-app-image: &app-image
  image: netanomaly:1.0.0
  build: .

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app-image
    environment:
      <<: *database-url
      MODEL_BUNDLE_PATH: /app/artifacts/${MODEL_RUN_ID:-full_seed42}/model_bundle.joblib
      MODEL_THRESHOLDS_PATH: /app/reports/${MODEL_RUN_ID:-full_seed42}/thresholds.json
      MODEL_ALGORITHM: ${MODEL_ALGORITHM:-lof_novelty}
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  # One-off commands: docker compose --profile tools run --rm <service> ...
  trainer:
    <<: *app-image
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./artifacts:/app/artifacts
    command: ["netanomaly", "run", "--mode", "full", "--lof-train-size", "100000"]

  loader:
    <<: *app-image
    profiles: ["tools"]
    environment:
      <<: *database-url
    volumes:
      - ./reports:/app/reports:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["netanomaly", "load-results", "--run-id", "${MODEL_RUN_ID:-full_seed42}"]

  replay:
    <<: *app-image
    profiles: ["tools"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["netanomaly", "replay", "--api-url", "http://api:8000", "--limit", "5000", "--batch-size", "200"]

  tests:
    <<: *app-image
    profiles: ["tools"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/netanomaly_test
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
